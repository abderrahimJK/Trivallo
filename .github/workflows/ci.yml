# Runs on every push to develop/main and on every pull request.
# 1. backend: compiles, runs unit tests and packages the jar (fails on MapStruct unmapped fields too).
# 2. docker: builds the backend image so a broken Dockerfile is caught before deploy day.
# Pushing images to a registry and deploying to the VPS come in week 4.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t trivallo-backend:ci backend
