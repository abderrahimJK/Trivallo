# Local development stack. Passwords come from .env (copy .env.example), never from this file.
#   docker compose up -d                 -> Postgres + Keycloak (run the backend from your IDE)
#   docker compose --profile app up -d   -> also builds backend + frontend behind Nginx on http://localhost:8000
# Production gets its own compose file with Nginx in week 4.

name: trivallo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trivallo}
      POSTGRES_USER: ${POSTGRES_USER:-trivallo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?copy .env.example to .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?copy .env.example to .env}
      # Tokens always carry this issuer, whether the browser or the backend container talks to Keycloak.
      KC_HOSTNAME: http://localhost:8081
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?copy .env.example to .env}
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      # Trivallo look for the login pages (realm loginTheme "trivallo").
      - ./infra/keycloak-themes/trivallo:/opt/keycloak/themes/trivallo:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trivallo}
      DB_USERNAME: ${POSTGRES_USER:-trivallo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/trivallo
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/trivallo/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    volumes:
      - media-data:/var/lib/trivallo/media
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    profiles: ["app"]
    build: ./frontend
    restart: unless-stopped
    environment:
      API_ORIGIN: http://backend:8080
      SITE_ORIGIN: http://localhost:8000
    depends_on:
      - backend

  nginx:
    profiles: ["app"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
  media-data:
