# Local stand-in for the production reverse proxy (week 4 adds TLS, caching and media).
# /api and /media -> Spring Boot, everything else -> Angular SSR.
server {
  listen 80;
  # $http_host keeps the port (localhost:8000). With $host, Spring sees Host "localhost" but
  # Origin "http://localhost:8000", treats same-site POSTs as cross-origin and rejects them (403).
  # Image uploads go up to 5 MB (see backend application.yml).
  client_max_body_size 6m;

  location /media/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend:4000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
