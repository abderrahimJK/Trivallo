# Local stand-in for the production reverse proxy (week 4 adds TLS, caching and media).
# /api and /media -> Spring Boot, everything else -> Angular SSR.
server {
  listen 80;
  # Image uploads go up to 5 MB (see backend application.yml).
  client_max_body_size 6m;

  location /media/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
